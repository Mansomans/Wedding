# Render Blueprint: one Node web service plus one Postgres database.
# In Render: New -> Blueprint -> pick this repo. You will be asked for SITE_PASSWORD.
databases:
  - name: wedding-db
    plan: basic-256mb
    databaseName: wedding
    user: wedding

services:
  - type: web
    name: cashwedding
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wedding-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SITE_PASSWORD
        sync: false
