<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E4C878"/>
      <stop offset="0.5" stop-color="#C6A653"/>
      <stop offset="1" stop-color="#9C7A1F"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#CFE6F7"/>
      <stop offset="1" stop-color="#7FB3D9"/>
    </linearGradient>
  </defs>
  <!-- her ring: O with a diamond -->
  <circle cx="20" cy="39" r="12.5" fill="none" stroke="url(#gold)" stroke-width="4.5"/>
  <!-- prongs -->
  <path d="M15.5 25.5 L14 21.5 M24.5 25.5 L26 21.5" stroke="#9C7A1F" stroke-width="1.6" stroke-linecap="round"/>
  <!-- diamond -->
  <polygon points="16,12 24,12 28,17 20,27 12,17" fill="url(#gem)" stroke="#5E93BD" stroke-width="0.9" stroke-linejoin="round"/>
  <path d="M12 17 H28 M16 12 L18.5 17 L20 27 M24 12 L21.5 17 M16 12 L14 17 M24 12 L26 17 M18.5 17 L20 27 L21.5 17" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="0.7"/>
  <!-- his ring: a plain, slightly heavier band -->
  <circle cx="44" cy="39" r="12.5" fill="none" stroke="url(#gold)" stroke-width="5.5"/>
  <!-- the "and", knocked out where the rings meet -->
  <circle cx="32" cy="39" r="7.2" fill="#FFFFFF"/>
  <text x="32" y="44.6" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-style="italic" font-weight="600" font-size="16" fill="#9C7A1F">&amp;</text>
</svg>
