<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<title>Our Wedding Weekend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Karla:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#FBF7EC; --line:#EBE2CC; --line-strong:#D3C08F;
  --ink:#2A2418; --ink-2:#5E543F; --muted:#8E8369;
  --accent:#9C7A1F; --accent-ink:#FFFFFF; --accent-soft:#F7EFD9;
  --gold:#C6A653; --gold-soft:#F7EFD9; --blush:#C6A653; --blush-soft:#F7EFD9;
  --good:#6B8E3D; --warn:#B4741A; --bad:#A7443A;
  --shadow:0 1px 2px rgba(120,95,30,.06),0 8px 24px -12px rgba(120,95,30,.18);
  --display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --body:"Karla","Helvetica Neue",Arial,sans-serif;
  --radius:10px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);font-weight:500;line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}

/* ---------- gate ---------- */
#gate{min-height:100%;display:grid;place-items:center;padding:24px 16px;background:var(--bg)}
.gate-card{width:100%;max-width:380px;text-align:center;display:grid;gap:18px}
.monogram{width:72px;height:72px;margin:0 auto;border:1.5px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:30px;font-style:italic;color:var(--gold)}
.gate-card h1{font-size:40px;font-style:italic}
.gate-form{display:grid;gap:10px}
.gate-form input{padding:12px 14px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--surface);text-align:center;letter-spacing:.2em;font-size:18px}
.gate-form input.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.btn{padding:10px 16px;border-radius:var(--radius);border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--line-strong)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.small{padding:6px 10px;font-size:13px}
.btn.danger{background:transparent;border-color:var(--line);color:var(--bad)}
.linkish{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:13px}
#hint{color:var(--ink-2)}
#gate-error{color:var(--bad);min-height:1.5em;font-size:13px}

/* ---------- shell ---------- */
#app{min-height:100%}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1120px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-size:26px;font-style:italic}
.brand h1 span{color:var(--gold)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--line-strong)}
.sync.db .dot{background:var(--good)}
.sync.local .dot{background:var(--warn)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:9px 12px 11px;border:0;background:none;color:var(--ink-2);border-bottom:2px solid transparent;font-weight:500;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .st{width:7px;height:7px;border-radius:50%;background:var(--line-strong)}
.tab .st.done{background:var(--good)}
main{max-width:1120px;margin:0 auto;padding-block:24px 64px;padding-inline:16px}
.view[hidden]{display:none}

/* ---------- home ---------- */
.hero{display:grid;gap:6px;margin-bottom:22px}
.hero h2{font-size:clamp(32px,5vw,48px);font-style:italic}
.hero .sub{color:var(--ink-2);font-size:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:28px}
.stat{background:var(--surface);padding:14px 16px;display:grid;gap:2px}
.stat .v{font-family:var(--display);font-size:30px;font-weight:600;line-height:1}
.stat .v small{font-size:14px;font-family:var(--body);font-weight:500;color:var(--muted);margin-left:4px}
.stat .l{font-size:12px;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-bottom:32px}
.day{display:grid;gap:12px;align-content:start}
.day-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--gold);padding-bottom:8px}
.day-head h3{font-size:24px}
.day-head .date{color:var(--muted);font-size:13px}
.slot{display:grid;grid-template-columns:72px 1fr;gap:12px}
.slot .time{font-weight:600;color:var(--accent);padding-top:14px;font-size:13px}
.slot .time.tbd{color:var(--muted);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.card .eyebrow{margin-bottom:4px}
.card h4{font-size:21px}
.card .where{color:var(--ink-2);font-size:13px;margin-top:2px}
.card .meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--ink-2)}
.card .meta b{color:var(--ink);font-weight:600}
.card.undecided{border-style:dashed;background:transparent;box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{padding:5px 10px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-size:13px;color:var(--ink-2)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.warnline{color:var(--warn);font-size:13px;margin-top:8px}

.budget{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px}
@media (max-width:760px){.budget{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 16px}
.panel h3{font-size:24px;margin-bottom:12px}
.panel .eyebrow{margin-bottom:2px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 0;border-bottom:1px solid var(--line)}
td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right;white-space:nowrap}
tr.total td{border-bottom:0;border-top:2px solid var(--line-strong);font-weight:700;font-size:16px;padding-top:12px}
td .sub{display:block;color:var(--muted);font-size:12px}
.extras{display:grid;gap:6px;margin-top:6px}
.extra{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.extra:last-child{border-bottom:0}
.extra label{flex:1;display:flex;align-items:center;gap:10px;cursor:pointer}
.extra .cost{color:var(--ink-2)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);margin:0}
.progress{display:grid;gap:8px;margin-top:6px}
.prog{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.prog:last-child{border-bottom:0}
.prog .pill{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;max-width:55%;overflow:hidden;text-overflow:ellipsis}
.prog .pill.done{background:var(--accent-soft);color:var(--accent)}
.prog button{background:none;border:0;padding:0;color:var(--ink);text-align:left;font-weight:500;text-decoration:none}
.prog button:hover{color:var(--accent)}

/* ---------- decision ---------- */
.dhead{display:grid;gap:6px;margin-bottom:18px;max-width:64ch}
.dhead h2{font-size:clamp(30px,4.5vw,42px);font-style:italic}
.dhead .q{color:var(--ink-2);font-size:16px}
.dhead .context{font-size:13px;color:var(--muted)}
.options{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:22px}
.opt{cursor:pointer;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;gap:10px;align-content:start;text-align:left;box-shadow:var(--shadow);transition:border-color .15s}
.opt:hover{border-color:var(--line-strong)}
.opt.picked{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow)}
.opt .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.opt h3{font-size:22px}
.opt .where{color:var(--ink-2);font-size:13px}
.opt .desc{font-size:14px;color:var(--ink-2)}
.opt .facts{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13px;color:var(--muted)}
.opt .facts b{color:var(--ink);font-weight:600;display:block}
.opt .pc{display:grid;gap:3px;font-size:13px}
.opt .pc .p::before{content:"+ ";color:var(--good);font-weight:700}
.opt .pc .c::before{content:"– ";color:var(--bad);font-weight:700}
.opt .est{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.opt .est .v{font-family:var(--display);font-size:24px;font-weight:600}
.opt .est .l{font-size:12px;color:var(--muted)}
.mark{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;flex:0 0 auto;color:var(--accent-ink);font-size:13px}
.opt.picked .mark{background:var(--accent);border-color:var(--accent)}
.opt .cap-warn{color:var(--warn);font-size:12px}
.notes{display:grid;gap:6px;max-width:64ch}
.notes textarea{width:100%;min-height:90px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);resize:vertical}
.clear-pick{margin-top:12px}

/* ---------- guests ---------- */
.ghead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:16px}
.ghead h2{font-size:clamp(30px,4.5vw,42px);font-style:italic}
.gstats{display:flex;flex-wrap:wrap;gap:16px;font-size:14px;color:var(--ink-2)}
.gstats b{font-family:var(--display);font-size:22px;color:var(--ink);font-weight:600;margin-right:4px}
.gtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.gtools input[type=search],.gtools select{padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.gtools input[type=search]{flex:1;min-width:160px}
.gtable-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.gtable{min-width:720px}
.gtable th,.gtable td{padding:9px 12px}
.gtable tbody tr{cursor:pointer}
.gtable tbody tr:hover{background:var(--surface-2)}
.gtable td.name{font-weight:600}
.status{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.status.invited{background:var(--accent-soft);color:var(--accent)}
.status.maybe{background:var(--gold-soft);color:var(--gold)}
.status.no{background:var(--blush-soft);color:var(--bad)}
.evdots{display:flex;gap:5px}
.evdots span{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:700;border:1px solid var(--line);color:var(--muted)}
.evdots span.on{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.gadd{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
@media (max-width:760px){.gadd{grid-template-columns:1fr}}
.bulk textarea{width:100%;min-height:110px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);resize:vertical}
.bulk .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.bulk select{padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}

.scenario input[type=range]{width:100%;accent-color:var(--accent);margin:8px 0 4px}
.scen-row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.scen-row b{color:var(--ink);font-family:var(--display);font-size:22px;font-weight:600}
.adddate{margin-bottom:22px;max-width:760px}
.adddate .grid3{margin-bottom:10px}
.adddate .field{margin-bottom:0}
.adddate .actions{display:flex;justify-content:flex-end;margin-top:12px}
.po{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.opt .rm{justify-self:start;color:var(--muted)}
.field.check label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);padding:9px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}

/* ---------- dialog ---------- */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(520px,calc(100vw - 32px));box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(20,26,23,.45)}
.dlg{padding:20px;display:grid;gap:14px}
.dlg h3{font-size:26px}
.field{display:grid;gap:4px;font-size:13px;color:var(--ink-2)}
.field input,.field select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:15px;color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:480px){.grid3{grid-template-columns:1fr 1fr}}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.checks label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.dlg-actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.dlg-actions .right{display:flex;gap:8px;margin-left:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <div class="monogram">&amp;</div>
    <div>
      <p class="eyebrow">Planning the weekend</p>
      <h1>Our Wedding</h1>
    </div>
    <form class="gate-form" id="gate-form" autocomplete="off">
      <input id="pw" type="password" inputmode="numeric" placeholder="Password" aria-label="Password">
      <button class="btn" type="submit">Enter</button>
      <div id="gate-error" role="alert"></div>
      <button class="linkish" type="button" id="hint-btn">Need a hint?</button>
      <p id="hint" class="small" hidden></p>
    </form>
  </div>
</div>

<div id="app" hidden>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <h1 id="brand-title">Our Wedding <span>Weekend</span></h1>
        <div class="sync" id="sync"><span class="dot"></span><span id="sync-text">Connecting…</span></div>
      </div>
      <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    </div>
  </header>
  <main id="main"></main>
</div>

<dialog id="guest-dialog">
  <form class="dlg" id="guest-form" method="dialog">
    <h3 id="guest-dialog-title">Add a guest</h3>
    <div class="field"><span>Name (or household, e.g. "The Alvarez family")</span><input id="g-name" required></div>
    <div class="grid3">
      <div class="field"><span>Side</span>
        <select id="g-side"></select></div>
      <div class="field"><span>Group</span>
        <select id="g-group"></select></div>
      <div class="field"><span>Head count</span><input id="g-party" type="number" min="1" max="20" value="1"></div>
    </div>
    <div class="field check"><label><input type="checkbox" id="g-plusone"> Offer a plus-one (counts as one more seat when they bring someone)</label></div>
    <div class="field"><span>Status</span>
      <select id="g-status">
        <option value="invited">Inviting</option>
        <option value="maybe">Maybe / B-list</option>
        <option value="no">Not inviting</option>
      </select></div>
    <div class="field"><span>Which parts of the weekend?</span>
      <div class="checks" id="g-events"></div></div>
    <div class="field"><span>Notes</span><input id="g-notes" placeholder="Dietary, travel, plus-one details…"></div>
    <div class="dlg-actions">
      <button type="button" class="btn danger small" id="g-delete" hidden>Remove guest</button>
      <div class="right">
        <button type="button" class="btn ghost" id="g-cancel">Cancel</button>
        <button type="submit" class="btn" id="g-save">Save guest</button>
      </div>
    </div>
  </form>
</dialog>
<div class="toast" id="toast" aria-live="polite"></div>

<script>
/* =====================================================================
   WEDDING WEEKEND — DATA BLOCK
   Everything below this line up to "END DATA BLOCK" is meant to be
   edited by hand (or by Claude). The rest of the page renders from it.

   HOW TO ADD AN OPTION: find the decision by its `id` in DECISIONS and
   push a new object into its `options` array. Only `id` and `name` are
   required. Fields:
     id        unique slug within the decision (never reuse one that was
               picked before, or the old pick will point at the new item)
     name      display name
     where     venue / neighborhood / address, shown under the name
     desc      one or two sentences
     time      start time, shown on the weekend itinerary ("6:30 PM")
     duration  free text ("2 hrs")
     fixed     flat cost in dollars (room fee, rental, offering, minimum)
     perGuest  cost per attending guest in dollars
     capacity  max guests; the page warns when the list exceeds it
     pros      array of strings
     cons      array of strings
     link      optional URL
   The DATE decision is special: each option has `date` (YYYY-MM-DD) and
   `costFactor` (1.0 = normal; peak season 1.1; off season 0.9) which
   scales the reception venue cost.

   HOW TO ADD A DECISION: add an object to DECISIONS with id, title,
   question, `eventKey` (which guest checkbox counts as attending:
   rehearsal | welcome | mass | reception, or null for none),
   `dayOffset` (-1 = the day before, 0 = wedding day), `order` (position
   in the day), and `options`. Add a matching entry to EVENTS if it is a
   new guest-facing event.
   ===================================================================== */

const CONFIG = {
  coupleTitle: "Our Wedding",           // shown on the gate and in the header
  // The password itself is checked by the server (SITE_PASSWORD env var).
  passwordHint: "Our engagement date, as eight digits (MMDDYYYY).",
  engagementDate: "2026-09-10",
  sides: ["Bride's side", "Groom's side", "Both / mutual"],
  groups: ["Immediate family", "Extended family", "Wedding party", "Close friends", "Friends", "Parents' friends", "Coworkers", "Plus-one"],
};

// Guest-facing events. `default` is whether a newly added guest is
// assumed to attend. Rehearsal dinner defaults off (wedding party + family).
const EVENTS = [
  { key: "rehearsal", label: "Rehearsal dinner", short: "R", default: false },
  { key: "welcome",   label: "Welcome party",    short: "W", default: true  },
  { key: "mass",      label: "Mass",             short: "M", default: true  },
  { key: "reception", label: "Reception",        short: "P", default: true  },
];

const DECISIONS = [
  {
    id: "date",
    title: "The Date",
    question: "When do we celebrate?",
    context: "Every option is a Saturday so the weekend keeps the same shape: rehearsal dinner and welcome party on Friday, Mass and reception on Saturday.",
    eventKey: null, dayOffset: null, order: 0,
    options: [
      { id: "2027-05-22", name: "Late spring", date: "2027-05-22", costFactor: 1.0,
        desc: "Gardens in bloom, mild evenings, before summer travel season starts.",
        pros: ["Comfortable weather for an outdoor welcome party", "Vendors still have availability"],
        cons: ["Close to Memorial Day travel", "Graduation season for families with students"] },
      { id: "2027-06-12", name: "Early summer", date: "2027-06-12", costFactor: 1.1,
        desc: "Long light evenings and the classic June wedding feel.",
        pros: ["Longest daylight for photos", "School is out for traveling families"],
        cons: ["Peak pricing at most venues", "Hot afternoons for a 1:30 Mass"] },

/* ---------------- state + storage ---------------- */
const state = {
  plan: { picks: {}, extras: Object.fromEntries(EXTRAS.map(e => [e.id, e.on])), notes: {}, customOptions: {}, plusOneRate: 100 },
  guests: [],           // [{id, name, side, group, party, status, events:{}, notes, createdAt}]
  storage: "loading",   // loading | server | offline
  route: "home",
  filter: { q: "", status: "all", side: "all" },
};
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36);

function defaultExtras() { const o = {}; EXTRAS.forEach(e => o[e.id] = e.on); return o; }
function normalizePlan(p) {
  p = p || {};
  return { picks: p.picks || {}, extras: p.extras || defaultExtras(), notes: p.notes || {},
    customOptions: p.customOptions || {}, plusOneRate: typeof p.plusOneRate === "number" ? p.plusOneRate : 100 };
}

/* API. Every call returns the full shared state, which we apply. */
let serverVersion = 0, planWriteTimer = null, planDirty = false;
async function api(method, url, body) {
  const r = await fetch(url, { method, headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined, credentials: "same-origin" });
  if (r.status === 401) { lock(); throw new Error("locked"); }
  if (!r.ok) { let m = "Request failed"; try { m = (await r.json()).error || m; } catch {} throw new Error(m); }
  return r.json();
}
function applyState(st, { force = false } = {}) {
  if (!st) return;
  // Do not yank the page out from under someone who is mid-edit.
  const busy = document.getElementById("guest-dialog").open || (document.activeElement && /^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName) && document.activeElement.id !== "g-search");
  if (busy && !force) return;
  serverVersion = st.version || 0;
  if (!planDirty) state.plan = normalizePlan(st.plan); // keep local picks while a write is pending
  state.guests = Array.isArray(st.guests) ? st.guests : [];
  state.storage = "server";
  render();
}

function savePlan() {
  planDirty = true;
  clearTimeout(planWriteTimer);
  planWriteTimer = setTimeout(async () => {
    const sent = JSON.stringify(state.plan);
    try {
      const st = await api("PUT", "/api/plan", state.plan);
      serverVersion = st.version || serverVersion;
      if (JSON.stringify(state.plan) === sent) planDirty = false; // nothing changed while in flight
      else savePlan();
    }
    catch (e) { planDirty = false; if (e.message !== "locked") toast("Could not save: " + e.message); }
  }, 300);
}
async function saveGuests(list) {
  try { applyState(await api("PUT", "/api/guests", list), { force: true }); }
  catch (e) { if (e.message !== "locked") toast("Could not save guest: " + e.message); }
}
const saveGuest = g => saveGuests([g]);
async function deleteGuest(id) {
  try { applyState(await api("DELETE", "/api/guests/" + encodeURIComponent(id)), { force: true }); }
  catch (e) { if (e.message !== "locked") toast("Could not remove guest: " + e.message); }
}

let pollTimer = null;
async function refresh() {
  try { const st = await api("GET", "/api/state"); if ((st.version || 0) !== serverVersion) applyState(st); state.storage = "server"; renderSync(); }
  catch (e) { if (e.message !== "locked") { state.storage = "offline"; renderSync(); } }
}
function connect() {
  render();
  refresh();
  clearInterval(pollTimer);
  pollTimer = setInterval(() => { if (document.visibilityState === "visible") refresh(); }, 8000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(); });
}

/* ---------------- derived numbers ---------------- */
const fmt$ = n => "$" + Math.round(n).toLocaleString("en-US");
const byId = (arr, id) => arr.find(x => x.id === id);
const decision = id => byId(DECISIONS, id);
// Built-in options from the data block plus any the couple added in the UI (stored in the plan).
const customOptions = d => Array.isArray(state.plan.customOptions?.[d.id]) ? state.plan.customOptions[d.id] : [];
const optionsOf = d => d.options.concat(customOptions(d));
function pickedOption(d) { const oid = state.plan.picks[d.id]; return oid ? byId(optionsOf(d), oid) : null; }
function invitedGuests() { return state.guests.filter(g => g.status === "invited"); }
function plusOneRate() { const r = state.plan.plusOneRate; return typeof r === "number" ? r : 100; }
function plusOnesOffered(list) { return list.filter(g => g.plusOne).length; }
// Heads = each party's own count, plus the share of offered plus-ones the scenario says will come.
function headcount(list, rate = plusOneRate()) { return list.reduce((s, g) => s + (Number(g.party) || 1), 0) + Math.round(plusOnesOffered(list) * rate / 100); }
function attendees(eventKey) {
  if (!eventKey) return invitedGuests();
  return invitedGuests().filter(g => g.events && g.events[eventKey]);
}
function dateFactor() { const o = pickedOption(decision("date")); return o && o.costFactor ? o.costFactor : 1; }
function optionCost(d, o, n) {
  const fixed = (o.fixed || 0) * (d.id === "reception" ? dateFactor() : 1);
  return fixed + (o.perGuest || 0) * n;
}
function budget() {
  const lines = [];
  let total = 0;
  DECISIONS.forEach(d => {
    if (!d.eventKey) return;
    const o = pickedOption(d);
    const n = headcount(attendees(d.eventKey));
    if (!o) { lines.push({ d, o: null, n, cost: 0 }); return; }
    const cost = optionCost(d, o, n);
    lines.push({ d, o, n, cost }); total += cost;
  });
  let extras = 0;
  EXTRAS.forEach(e => { if (state.plan.extras[e.id]) extras += e.cost; });
  return { lines, extras, total: total + extras };
}
function weddingDate() { const o = pickedOption(decision("date")); return o && o.date ? new Date(o.date + "T12:00:00") : null; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
const longDate = d => d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" });
const shortDate = d => d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
const weekday = d => d.toLocaleDateString("en-US", { weekday: "long" });
function daysUntil(d) { const t = new Date(); t.setHours(12, 0, 0, 0); return Math.round((d - t) / 86400000); }
function timeMinutes(t) { // "6:30 PM" -> minutes, for sorting
  if (!t) return 9999; const m = /(\d+)(?::(\d+))?\s*(AM|PM)?/i.exec(t); if (!m) return 9999;
  let h = +m[1] % 12; if ((m[3] || "").toUpperCase() === "PM") h += 12; return h * 60 + (+m[2] || 0);
}

/* ---------------- rendering ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function renderSync() {
  const el = $("#sync"); if (!el) return;
  el.className = "sync " + state.storage;
  $("#sync-text").textContent = state.storage === "server" ? "Shared, saves for both of us" : state.storage === "offline" ? "Offline, reconnecting…" : "Connecting…";
}

function renderTabs() {
  const tabs = [{ id: "home", label: "The Weekend" }, ...DECISIONS.map(d => ({ id: d.id, label: d.title, done: !!pickedOption(d) })), { id: "guests", label: "Guests", count: headcount(invitedGuests()) }];
  $("#tabs").innerHTML = tabs.map(t => `<button class="tab ${state.route === t.id ? "active" : ""}" data-route="${t.id}" role="tab" aria-selected="${state.route === t.id}">
      ${t.done !== undefined ? `<span class="st ${t.done ? "done" : ""}"></span>` : ""}${esc(t.label)}${t.count !== undefined ? ` <span class="muted num">${t.count}</span>` : ""}</button>`).join("");
}

function render() {
  if ($("#app").hidden) return;
  renderTabs(); renderSync();
  const main = $("#main");
  if (state.route === "home") main.innerHTML = renderHome();
  else if (state.route === "guests") main.innerHTML = renderGuests();
  else { const d = decision(state.route); main.innerHTML = d ? renderDecision(d) : renderHome(); }
  bindMain();
}

function renderSlot(d) {
  const o = pickedOption(d);
  if (!o) {
    return `<div class="slot"><div class="time tbd">—</div>
      <div class="card undecided"><p class="eyebrow">${esc(d.title)}</p><h4>Still deciding</h4>
      <div class="chips">${optionsOf(d).slice(0, 4).map(x => `<button class="chip" data-pick="${d.id}" data-option="${x.id}">${esc(x.name)}</button>`).join("")}<button class="chip" data-route="${d.id}">All options →</button></div></div></div>`;
  }
  const n = headcount(attendees(d.eventKey));
  const over = o.capacity && n > o.capacity;
  return `<div class="slot"><div class="time">${esc(o.time || "")}</div>
    <div class="card"><p class="eyebrow">${esc(d.title)}</p><h4>${esc(o.name)}</h4>
    ${o.where ? `<p class="where">${esc(o.where)}</p>` : ""}
    <div class="meta"><span><b class="num">${n}</b> guests</span>${o.duration ? `<span>${esc(o.duration)}</span>` : ""}<span><b class="num">${fmt$(optionCost(d, o, n))}</b> est.</span></div>
    ${over ? `<p class="warnline">Over capacity: ${o.capacity} max, ${n} on the list.</p>` : ""}
    </div></div>`;
}

function renderDecision(d) {
  const picked = state.plan.picks[d.id];
  const n = d.eventKey ? headcount(attendees(d.eventKey)) : 0;
  return `
  <section class="dhead">
    <p class="eyebrow">Decision</p>
    <h2>${esc(d.title)}</h2>
    <p class="q">${esc(d.question)}</p>
    ${d.context ? `<p class="context">${esc(d.context)}${d.eventKey ? ` Right now that is <b class="num">${n}</b> people.` : ""}</p>` : ""}
  </section>
  <div class="options">
    ${optionsOf(d).map(o => {
      const isPicked = picked === o.id;
      const cost = d.eventKey ? optionCost(d, o, n) : null;
      const over = o.capacity && n > o.capacity;
      const dateObj = o.date ? new Date(o.date + "T12:00:00") : null;
      return `<div class="opt ${isPicked ? "picked" : ""}" data-pick="${d.id}" data-option="${o.id}" role="button" tabindex="0" aria-pressed="${isPicked}">
        <div class="top"><div><h3>${esc(o.name)}</h3>${o.where ? `<p class="where">${esc(o.where)}</p>` : ""}${dateObj ? `<p class="where">${longDate(dateObj)}</p>` : ""}</div><span class="mark">${isPicked ? "✓" : ""}</span></div>
        ${o.desc ? `<p class="desc">${esc(o.desc)}</p>` : ""}
        <div class="facts">
          ${o.time ? `<div><b>${esc(o.time)}</b>Start${o.duration ? ` · ${esc(o.duration)}` : ""}</div>` : ""}
          ${o.capacity && o.capacity < 999 ? `<div><b class="num">${o.capacity}</b>Capacity</div>` : ""}
          ${o.fixed ? `<div><b class="num">${fmt$(o.fixed)}</b>Fixed</div>` : ""}
          ${o.perGuest ? `<div><b class="num">${fmt$(o.perGuest)}</b>Per guest</div>` : ""}
          ${o.costFactor ? `<div><b class="num">${o.costFactor}×</b>Venue season factor</div>` : ""}
          ${dateObj ? `<div><b class="num">${daysUntil(dateObj)}</b>Days from today</div>` : ""}
        </div>
        ${(o.pros || o.cons) ? `<div class="pc">${(o.pros || []).map(p => `<span class="p">${esc(p)}</span>`).join("")}${(o.cons || []).map(c => `<span class="c">${esc(c)}</span>`).join("")}</div>` : ""}
        ${over ? `<p class="cap-warn">Over capacity for the current list (${n}).</p>` : ""}
        ${cost !== null ? `<div class="est"><span class="l">For ${n} guests</span><span class="v num">${fmt$(cost)}</span></div>` : ""}
        ${o.link ? `<a href="${esc(o.link)}" target="_blank" rel="noopener" class="linkish" onclick="event.stopPropagation()">Website</a>` : ""}
        ${o.custom ? `<button class="linkish rm" data-remove-option="${d.id}" data-option-id="${o.id}">Remove this date</button>` : ""}
      </div>`;
    }).join("")}
  </div>
  ${d.id === "date" ? `<div class="panel adddate">
    <p class="eyebrow">Add a date</p>
    <h3>Another day to consider</h3>
    <div class="grid3">
      <div class="field"><span>Date</span><input type="date" id="nd-date" min="2027-01-01" max="2028-12-31"></div>
      <div class="field"><span>Label</span><input id="nd-name" placeholder="e.g. Memorial Day weekend"></div>
      <div class="field"><span>Venue season factor</span>
        <select id="nd-factor"><option value="0.9">0.9× off-peak</option><option value="1" selected>1.0× normal</option><option value="1.05">1.05× busy</option><option value="1.1">1.1× peak</option></select></div>
    </div>
    <div class="field"><span>Why this date?</span><input id="nd-desc" placeholder="Notes, conflicts, who is in town"></div>
    <div class="actions"><button class="btn" id="nd-add">Add this date</button></div>
  </div>` : ""}
  <div class="notes">
    <label class="eyebrow" for="note-${d.id}">Our notes on this decision</label>
    <textarea id="note-${d.id}" data-note="${d.id}" placeholder="Quotes, contacts, things to ask the venue…">${esc(state.plan.notes[d.id] || "")}</textarea>
  </div>
  ${picked ? `<button class="btn ghost small clear-pick" data-clear="${d.id}">Un-pick and leave this open</button>` : ""}`;
}

function renderGuests() {
  const f = state.filter;
  const q = f.q.trim().toLowerCase();
  let list = state.guests.slice().sort((a, b) => a.name.localeCompare(b.name));
  if (q) list = list.filter(g => (g.name + " " + (g.notes || "") + " " + (g.group || "")).toLowerCase().includes(q));
  if (f.status !== "all") list = list.filter(g => g.status === f.status);
  if (f.side !== "all") list = list.filter(g => g.side === f.side);
  const inv = invitedGuests();
  return `
  <div class="ghead">
    <div><p class="eyebrow">Guest list</p><h2>Who we celebrate with</h2></div>
    <div class="gstats">
      <span><b class="num">${headcount(inv)}</b>inviting</span>
      <span><b class="num">${headcount(state.guests.filter(g => g.status === "maybe"))}</b>maybe</span>
      <span><b class="num">${plusOnesOffered(inv)}</b>plus-ones offered</span>
      ${EVENTS.map(e => `<span><b class="num">${headcount(attendees(e.key))}</b>${esc(e.label.toLowerCase())}</span>`).join("")}
    </div>
  </div>
  <div class="gtools">
    <input type="search" id="g-search" placeholder="Search names, groups, notes" value="${esc(f.q)}" aria-label="Search guests">
    <select id="g-filter-status" aria-label="Filter by status"><option value="all" ${f.status === "all" ? "selected" : ""}>All statuses</option><option value="invited" ${f.status === "invited" ? "selected" : ""}>Inviting</option><option value="maybe" ${f.status === "maybe" ? "selected" : ""}>Maybe</option><option value="no" ${f.status === "no" ? "selected" : ""}>Not inviting</option></select>
    <select id="g-filter-side" aria-label="Filter by side"><option value="all">All sides</option>${CONFIG.sides.map(s => `<option value="${esc(s)}" ${f.side === s ? "selected" : ""}>${esc(s)}</option>`).join("")}</select>
    <button class="btn" id="g-add">Add guest</button>
  </div>
  <div class="gtable-wrap">
    ${list.length ? `<table class="gtable">
      <thead><tr><th>Name</th><th>Side</th><th>Group</th><th class="r">Heads</th><th title="Offer a plus-one">+1</th><th>Status</th><th>Events</th></tr></thead>
      <tbody>${list.map(g => `<tr data-guest="${g.id}" tabindex="0">
        <td class="name">${esc(g.name)}${g.notes ? `<span class="sub small muted" style="display:block;font-weight:400">${esc(g.notes)}</span>` : ""}</td>
        <td>${esc(g.side || "")}</td><td>${esc(g.group || "")}</td><td class="r num">${Number(g.party) || 1}${g.plusOne ? " <span class=\"muted\">+1</span>" : ""}</td>
        <td><input type="checkbox" class="po" data-plusone="${g.id}" ${g.plusOne ? "checked" : ""} aria-label="Plus-one for ${esc(g.name)}"></td>
        <td><span class="status ${esc(g.status)}">${g.status === "invited" ? "Inviting" : g.status === "maybe" ? "Maybe" : "Not inviting"}</span></td>
        <td><div class="evdots">${EVENTS.map(e => `<span class="${g.events && g.events[e.key] ? "on" : ""}" title="${esc(e.label)}">${e.short}</span>`).join("")}</div></td>
      </tr>`).join("")}</tbody></table>`
    : `<div class="empty">${state.guests.length ? "No guests match that filter." : "No guests yet. Add one at a time, or paste a whole list below."}</div>`}
  </div>
  <div class="gadd">
    <div class="panel bulk">
      <p class="eyebrow">Quick add</p>
      <h3>Paste a list</h3>
      <p class="small muted" style="margin-bottom:8px">One guest or household per line. Add a number after a comma for head count, e.g. <code>The Nguyen family, 4</code>. Toggle plus-ones in the +1 column afterwards.</p>
      <textarea id="bulk-text" placeholder="Aunt Carol&#10;Sam &amp; Priya Patel, 2&#10;The Nguyen family, 4"></textarea>
      <div class="row">
        <select id="bulk-side">${CONFIG.sides.map(s => `<option>${esc(s)}</option>`).join("")}</select>
        <select id="bulk-group">${CONFIG.groups.map(s => `<option>${esc(s)}</option>`).join("")}</select>
        <select id="bulk-status"><option value="invited">Inviting</option><option value="maybe">Maybe</option></select>
        <button class="btn ghost" id="bulk-add">Add these guests</button>
      </div>
    </div>
    <div class="panel">
      <p class="eyebrow">Legend</p>
      <h3>Event letters</h3>
      <div class="progress">${EVENTS.map(e => `<div class="prog"><span><span class="evdots" style="display:inline-flex;vertical-align:middle;margin-right:8px"><span class="on">${e.short}</span></span>${esc(e.label)}</span><span class="pill">${e.default ? "on by default" : "off by default"}</span></div>`).join("")}</div>
      <p class="small muted" style="margin-top:10px">Click any guest to change which events they are part of. Only guests marked "Inviting" count toward headcounts and the budget.</p>
    </div>
  </div>`;
}

/* ---------------- events ---------------- */
function go(route) { state.route = route; try { location.hash = route; } catch {} render(); window.scrollTo({ top: 0 }); }
function pick(did, oid) {
  if (state.plan.picks[did] === oid) return;
  state.plan.picks[did] = oid; savePlan(); render();
  const d = decision(did), o = byId(optionsOf(d), oid);
  toast(`${d.title}: ${o.name}`);
}
function bindMain() {
  const main = $("#main");
  main.querySelectorAll("[data-route]").forEach(b => b.addEventListener("click", () => go(b.dataset.route)));
  main.querySelectorAll("[data-pick]").forEach(b => { b.addEventListener("click", () => pick(b.dataset.pick, b.dataset.option)); b.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(b.dataset.pick, b.dataset.option); } }); });
  main.querySelectorAll("[data-remove-option]").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation();
    const did = b.dataset.removeOption, oid = b.dataset.optionId;
    const d = decision(did), o = byId(optionsOf(d), oid);
    if (!confirm(`Remove "${o ? o.name : "this option"}" from ${d.title}?`)) return;
    state.plan.customOptions[did] = customOptions(d).filter(x => x.id !== oid);
    if (state.plan.picks[did] === oid) delete state.plan.picks[did];
    savePlan(); render();
  }));
  const ndAdd = $("#nd-add"); if (ndAdd) ndAdd.addEventListener("click", () => {
    const dateStr = $("#nd-date").value;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) { toast("Pick a date first"); $("#nd-date").focus(); return; }
    const dt = new Date(dateStr + "T12:00:00");
    if (optionsOf(decision("date")).some(x => x.date === dateStr)) { toast("That date is already on the list"); return; }
    const label = $("#nd-name").value.trim();
    const o = { id: "custom-" + uid(), custom: true, date: dateStr, costFactor: +$("#nd-factor").value || 1,
      name: label || dt.toLocaleDateString("en-US", { month: "long", day: "numeric" }), desc: $("#nd-desc").value.trim() };
    if (!state.plan.customOptions) state.plan.customOptions = {};
    state.plan.customOptions.date = customOptions(decision("date")).concat([o]);
    savePlan(); render();
    toast(dt.getDay() === 6 ? `Added ${o.name}` : `Added ${o.name}. Heads up: that is a ${weekday(dt)}, not a Saturday.`);
  });
  const po = $("#po-rate"); if (po) {
    po.addEventListener("input", () => {
      state.plan.plusOneRate = +po.value;
      $("#po-pct").textContent = po.value + "%";
      $("#po-count").textContent = Math.round(plusOnesOffered(invitedGuests()) * plusOneRate() / 100);
    });
    po.addEventListener("change", () => { savePlan(); render(); });
  }
  main.querySelectorAll("[data-plusone]").forEach(c => {
    c.addEventListener("click", e => e.stopPropagation());
    c.addEventListener("change", () => { const g = byId(state.guests, c.dataset.plusone); if (g) saveGuest({ ...g, plusOne: c.checked }); });
  });
  main.querySelectorAll("[data-clear]").forEach(b => b.addEventListener("click", () => { delete state.plan.picks[b.dataset.clear]; savePlan(); render(); }));
  main.querySelectorAll("[data-extra]").forEach(c => c.addEventListener("change", () => { state.plan.extras[c.dataset.extra] = c.checked; savePlan(); render(); }));
  main.querySelectorAll("[data-note]").forEach(t => {
    let timer; t.addEventListener("input", () => { state.plan.notes[t.dataset.note] = t.value; clearTimeout(timer); timer = setTimeout(savePlan, 500); });
  });
  const s = $("#g-search"); if (s) s.addEventListener("input", () => { state.filter.q = s.value; const pos = s.selectionStart; render(); const s2 = $("#g-search"); s2.focus(); s2.setSelectionRange(pos, pos); });
  const fs = $("#g-filter-status"); if (fs) fs.addEventListener("change", () => { state.filter.status = fs.value; render(); });
  const fd = $("#g-filter-side"); if (fd) fd.addEventListener("change", () => { state.filter.side = fd.value; render(); });
  const add = $("#g-add"); if (add) add.addEventListener("click", () => openGuest(null));
  main.querySelectorAll("[data-guest]").forEach(r => {
    const open = () => openGuest(byId(state.guests, r.dataset.guest));
    r.addEventListener("click", open); r.addEventListener("keydown", e => { if (e.key === "Enter") open(); });
  });
  const bulk = $("#bulk-add"); if (bulk) bulk.addEventListener("click", bulkAdd);
}

async function bulkAdd() {
  const lines = $("#bulk-text").value.split("\n").map(l => l.trim()).filter(Boolean);
  if (!lines.length) return;
  const side = $("#bulk-side").value, group = $("#bulk-group").value, status = $("#bulk-status").value;
  const events = {}; EVENTS.forEach(e => events[e.key] = e.default);
  const added = [];
  for (const line of lines) {
    const m = /^(.*?)(?:,\s*(\d+))?$/.exec(line);
    const g = { id: uid(), name: (m[1] || line).trim(), side, group, party: Math.max(1, +m[2] || 1), plusOne: false, status, events: { ...events }, notes: "", createdAt: Date.now() };
    added.push(g);
  }
  await saveGuests(added);
  toast(`Added ${added.length} ${added.length === 1 ? "guest" : "guests"}`);
}

let editing = null;
function openGuest(g) {
  editing = g;
  $("#guest-dialog-title").textContent = g ? "Edit guest" : "Add a guest";
  $("#g-side").innerHTML = CONFIG.sides.map(s => `<option>${esc(s)}</option>`).join("");
  $("#g-group").innerHTML = CONFIG.groups.map(s => `<option>${esc(s)}</option>`).join("");
  $("#g-events").innerHTML = EVENTS.map(e => `<label><input type="checkbox" id="g-ev-${e.key}" data-ev="${e.key}" ${(g ? g.events && g.events[e.key] : e.default) ? "checked" : ""}> ${esc(e.label)}</label>`).join("");
  $("#g-name").value = g ? g.name : "";
  $("#g-side").value = g ? g.side : CONFIG.sides[0];
  $("#g-group").value = g ? g.group : CONFIG.groups[0];
  $("#g-party").value = g ? (g.party || 1) : 1;
  $("#g-plusone").checked = g ? !!g.plusOne : false;
  $("#g-status").value = g ? g.status : "invited";
  $("#g-notes").value = g ? (g.notes || "") : "";
  $("#g-delete").hidden = !g;
  $("#g-save").textContent = g ? "Save changes" : "Add guest";
  $("#guest-dialog").showModal();
  setTimeout(() => $("#g-name").focus(), 30);
}
$("#g-cancel").addEventListener("click", () => $("#guest-dialog").close());
$("#g-delete").addEventListener("click", async () => {
  if (!editing) return;
  if (!confirm(`Remove ${editing.name} from the list?`)) return;
  $("#guest-dialog").close(); await deleteGuest(editing.id); toast("Guest removed");
});
$("#guest-form").addEventListener("submit", async e => {
  e.preventDefault();
  const name = $("#g-name").value.trim(); if (!name) return;
  const events = {}; EVENTS.forEach(ev => events[ev.key] = $("#g-ev-" + ev.key).checked);
  const g = { id: editing ? editing.id : uid(), name, side: $("#g-side").value, group: $("#g-group").value,
    party: Math.max(1, +$("#g-party").value || 1), plusOne: $("#g-plusone").checked, status: $("#g-status").value, events, notes: $("#g-notes").value.trim(),
    createdAt: editing ? (editing.createdAt || Date.now()) : Date.now() };
  $("#guest-dialog").close();
  await saveGuest(g); toast(editing ? "Guest updated" : "Guest added");
});
document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("[data-route]"); if (b) go(b.dataset.route); });

let toastTimer;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200); }

/* ---------------- gate ---------------- */
function unlock() {
  $("#gate").hidden = true; $("#app").hidden = false;
  const h = (location.hash || "").slice(1);
  state.route = h && (h === "home" || h === "guests" || decision(h)) ? h : "home";
  connect();
}
function lock() {
  clearInterval(pollTimer);
  $("#app").hidden = true; $("#gate").hidden = false;
  $("#pw").value = ""; $("#pw").focus();
}
$("#hint-btn").addEventListener("click", () => { const h = $("#hint"); h.hidden = false; h.textContent = CONFIG.passwordHint; });
$("#gate-form").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("#gate-form button[type=submit]"); btn.disabled = true;
  $("#gate-error").textContent = "";
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: $("#pw").value }), credentials: "same-origin" });
    if (r.ok) { unlock(); return; }
    let msg = "That is not it. Try the hint.";
    if (r.status === 429) { try { msg = (await r.json()).error; } catch {} }
    $("#gate-error").textContent = msg;
    const i = $("#pw"); i.classList.remove("shake"); void i.offsetWidth; i.classList.add("shake"); i.select();
  } catch {
    $("#gate-error").textContent = "Cannot reach the server. Check your connection and try again.";
  } finally { btn.disabled = false; }
});
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (!$("#app").hidden && h && h !== state.route && (h === "home" || h === "guests" || decision(h))) { state.route = h; render(); } });
document.querySelector("#gate h1").textContent = CONFIG.coupleTitle;
document.querySelector("#brand-title").innerHTML = esc(CONFIG.coupleTitle) + " <span>Weekend</span>";
(async function boot() {
  // A valid session cookie skips the gate.
  try { const r = await fetch("/api/state", { credentials: "same-origin" }); if (r.ok) { const st = await r.json(); unlock(); applyState(st, { force: true }); return; } } catch {}
  $("#pw").focus();
})();
</script>
</body>
</html>
